server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:plip_video}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

eureka:
  instance:
    hostname: video
    prefer-ip-address: false
    instance-id: ${spring.application.name}:docker:${server.port}
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    topics:
      video-uploaded: ${APP_KAFKA_TOPICS_VIDEO_UPLOADED:video.uploaded}
      diary-video-uploaded: ${APP_KAFKA_TOPICS_DIARY_VIDEO_UPLOADED:diary.video.uploaded}
  topic:
    internal-base-url: ${TOPIC_INTERNAL_BASE_URL:http://topic:8080}
    internal-api-key: ${TOPIC_INTERNAL_API_KEY:}

plip:
  internal:
    api-key: ${INTERNAL_API_KEY:}
  video:
    outbox:
      relay-batch-size: ${VIDEO_OUTBOX_RELAY_BATCH_SIZE:20}
      max-attempts: ${VIDEO_OUTBOX_MAX_ATTEMPTS:5}
      relay-interval-ms: ${VIDEO_OUTBOX_RELAY_INTERVAL_MS:5000}
      retry-backoff-ms: ${VIDEO_OUTBOX_RETRY_BACKOFF_MS:1000}
  aws:
    enabled: ${AWS_ENABLED:true}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-ttl-seconds: ${AWS_PRESIGNED_URL_TTL_SECONDS:10800}
    s3:
      raw-bucket: ${AWS_S3_RAW_BUCKET:}
      processed-bucket: ${AWS_S3_PROCESSED_BUCKET:}
      cdn-base-url: ${AWS_CDN_BASE_URL:}
    sqs:
      video-processing-queue-url: ${AWS_SQS_VIDEO_PROCESSING_QUEUE_URL:}
    lambda:
      thumbnail-function-arn: ${AWS_LAMBDA_THUMBNAIL_ARN:}
