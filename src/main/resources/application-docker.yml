server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:plip_video}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    hostname: video
    prefer-ip-address: false
    instance-id: ${spring.application.name}:docker:${server.port}
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}

plip:
  internal:
    api-key: ${INTERNAL_API_KEY:}
  aws:
    enabled: ${AWS_ENABLED:true}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-ttl-seconds: ${AWS_PRESIGNED_URL_TTL_SECONDS:10800}
    s3:
      raw-bucket: ${AWS_S3_RAW_BUCKET:}
      processed-bucket: ${AWS_S3_PROCESSED_BUCKET:}
      cdn-base-url: ${AWS_CDN_BASE_URL:}
    sqs:
      video-processing-queue-url: ${AWS_SQS_VIDEO_PROCESSING_QUEUE_URL:}
    lambda:
      thumbnail-function-arn: ${AWS_LAMBDA_THUMBNAIL_ARN:}
