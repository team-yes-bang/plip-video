openapi: 3.1.0
info:
  title: Video Service API
  description: 5초 영상·이미지(미디어) 업로드/등록/다운로드 가공 API
  version: v1.0.0
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Video
  description: 5초 영상 Presigned 업로드·조회 API
- name: Health
  description: 서비스 상태 확인
paths:
  /api/videos:
    post:
      tags:
      - Video
      summary: "[레거시] multipart 영상 업로드"
      description: PR-6에서 제거 예정. upload-url + complete 사용 권장.
      operationId: register
      parameters:
      - name: userUuid
        in: query
        description: 업로더 UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: caption
        in: query
        description: 캡션 (선택)
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                videoFile:
                  type: string
                  format: binary
                  description: 영상 파일 (최대 5초)
              required:
              - videoFile
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VideoRegisterResponse"
  /api/videos/{videoUuid}/download-processing:
    post:
      tags:
      - Video
      summary: "[레거시] 다운로드용 영상 가공 요청"
      description: PR-6에서 제거 예정. complete 시 자동 enqueue.
      operationId: requestDownloadProcessing
      parameters:
      - name: videoUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
  /api/videos/{videoUuid}/complete:
    post:
      tags:
      - Video
      summary: 영상 업로드 complete
      description: |
        S3 업로드 완료 후 메타데이터를 DB에 저장합니다.
        - HeadObject로 raw 파일 존재·용량 검증
        - thumbnail_image_path = null (Lambda callback 대기)
        - overlayTime = created_at KST HH:mm
      operationId: complete
      parameters:
      - name: videoUuid
        in: path
        description: upload-url에서 발급된 video UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: userUuid
        in: query
        description: 업로더 UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoCompleteRequest"
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VideoCompleteResponse"
  /api/videos/upload-url:
    post:
      tags:
      - Video
      summary: Presigned upload URL 발급
      description: |
        영상 UUID와 S3 Presigned PUT URL을 발급합니다.
        - DB INSERT 없음 (complete에서 저장)
        - rawS3Key = videos/raw/{videoUuid}.mp4
      operationId: issueUploadUrl
      parameters:
      - name: userUuid
        in: query
        description: 업로더 UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: contentType
        in: query
        description: "Content-Type (선택, 기본 video/mp4)"
        required: false
        schema:
          type: string
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VideoUploadUrlResponse"
  /api/videos/{videoUuid}:
    get:
      tags:
      - Video
      summary: 영상 상세 조회
      description: |
        피드 재생용 영상 메타데이터와 raw Presigned GET URL을 반환합니다.
        - rawPlaybackUrl: raw bucket Presigned GET (TTL 3h)
        - thumbnailUrl: Lambda callback 전 null
        - overlayTime: created_at KST HH:mm (프론트 UI 오버레이)
        - downloadReady: processed_path 존재 여부
      operationId: getVideo
      parameters:
      - name: videoUuid
        in: path
        description: 영상 UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VideoDetailResponse"
  /api/test:
    get:
      tags:
      - Health
      summary: 헬스체크
      operationId: test
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    VideoRegisterResponse:
      type: object
      description: 영상 등록 응답
      properties:
        videoUuid:
          type: string
          format: uuid
          description: 영상 UUID — Agit/Diary 등 타 서비스에서 참조
        caption:
          type: string
          description: 캡션 (없으면 null)
        createdAt:
          type: string
          format: date-time
          description: "업로드 시각 (created_at, HH:mm 오버레이용)"
        thumbnailUrl:
          type: string
          description: 썸네일 URL
    VideoCompleteRequest:
      type: object
      description: 영상 업로드 complete 요청
      properties:
        caption:
          type: string
          description: 캡션 (선택)
    VideoCompleteResponse:
      type: object
      description: 영상 업로드 complete 응답
      properties:
        videoUuid:
          type: string
          format: uuid
          description: 영상 UUID
        caption:
          type: string
          description: 캡션 (없으면 null)
        createdAt:
          type: string
          format: date-time
          description: 업로드 시각 (created_at)
        overlayTime:
          type: string
          description: "HH:mm 오버레이용 시각 (KST, created_at 기준)"
    VideoUploadUrlResponse:
      type: object
      description: Presigned URL 발급 응답
      properties:
        videoUuid:
          type: string
          format: uuid
          description: 영상 UUID (UUIDv7)
        rawS3Key:
          type: string
          description: S3 object key (raw bucket)
        uploadUrl:
          type: string
          description: Presigned PUT URL
        expiresAt:
          type: string
          format: date-time
          description: Presigned URL 만료 시각 (UTC)
    VideoDetailResponse:
      type: object
      description: 영상 상세 조회 응답 (피드 재생용)
      properties:
        videoUuid:
          type: string
          format: uuid
          description: 영상 UUID
        userUuid:
          type: string
          format: uuid
          description: 업로더 UUID
        caption:
          type: string
          description: 캡션 (없으면 null)
        createdAt:
          type: string
          format: date-time
          description: 업로드 시각 (created_at)
        rawPlaybackUrl:
          type: string
          description: 원본(raw) 영상 Presigned GET URL (TTL 3h)
        thumbnailUrl:
          type: string
          description: 썸네일 URL (Lambda callback 전 null)
        overlayTime:
          type: string
          description: "HH:mm 오버레이용 시각 (KST, created_at 기준)"
        downloadReady:
          type: boolean
          description: 다운로드용 가공본 준비 여부 (processed_path 존재)
