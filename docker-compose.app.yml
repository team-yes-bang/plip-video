# video 서비스 App 컨테이너 정의 (Develop PC SSOT)
# plip-develop-env 에서 include 합니다.

services:
  video:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plip-service-video
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: plip_video
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: video
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      AWS_ENABLED: ${AWS_ENABLED:-true}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_RAW_BUCKET: ${AWS_S3_RAW_BUCKET}
      AWS_S3_PROCESSED_BUCKET: ${AWS_S3_PROCESSED_BUCKET}
      AWS_SQS_VIDEO_PROCESSING_QUEUE_URL: ${AWS_SQS_VIDEO_PROCESSING_QUEUE_URL}
      AWS_LAMBDA_THUMBNAIL_ARN: ${AWS_LAMBDA_THUMBNAIL_ARN}
      AWS_CDN_BASE_URL: ${AWS_CDN_BASE_URL}
      AWS_PRESIGNED_URL_TTL_SECONDS: ${AWS_PRESIGNED_URL_TTL_SECONDS:-10800}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - plip-net
