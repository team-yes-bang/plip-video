# video 서비스 로컬 Docker Compose
# Develop 통합 환경용 docker-compose.app.yml 을 include 합니다.

include:
  - docker-compose.app.yml

networks:
  plip-net:
    driver: bridge

services:
  mysql:
    image: mysql:8.4
    container_name: plip-video-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plip_video}
    ports:
      - "3308:3306"
    volumes:
      - plip_video_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - plip-net

  # 로컬 Docker로 App까지 실행할 때 주석 해제
  # video:
  #   depends_on: !reset
  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     EUREKA_CLIENT_ENABLED: "false"
  #   ports:
  #     - "${SERVER_PORT:-8080}:8080"

  # app.yml의 video는 Develop PC(Eureka 포함)용 — 로컬 기본 up 에서는 제외
  video:
    profiles:
      - docker-app

volumes:
  plip_video_mysql_data:
