name: Deploy to Develop PC

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  trigger-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger develop PC deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEVELOP_ENV_PAT }}
          repository: team-yes-bang/plip-develop-env
          event-type: deploy-service
          client-payload: |
            {
              "service": "video",
              "sha": "${{ github.sha }}",
              "repo": "${{ github.repository }}"
            }
